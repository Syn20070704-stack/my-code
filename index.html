<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>每日额度管家</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <style>
        /* --- 核心极简配色 --- */
        :root {
            --bg-color: #F7F8FA; /* 极浅的灰白色背景 */
            --card-bg: #FFFFFF; /* 纯白卡片 */
            --text-main: #111111; /* 碳黑色文字 */
            --text-sub: #888888; /* 浅灰色辅助文字 */
            --accent-color: #111111; /* 按钮用纯黑，非常高级 */
            --danger-color: #E55353; /* 克制而高级的柔和红 */
            --success-color: #2B8A3E; /* 低调的深绿 */
            --border-color: #E5E5EA; /* 极浅的描边 */
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .app-container {
            background: var(--bg-color);
            width: 100%;
            max-width: 400px;
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 顶部信息栏：大量留白，无边框 */
        .header {
            padding: 30px 24px 10px;
            background: transparent;
            text-align: left;
        }

            .header .label {
                font-size: 13px;
                color: var(--text-sub);
                letter-spacing: 1px;
                margin-bottom: 8px;
            }

        .money-display {
            font-size: 42px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -1px;
            margin: 0;
        }

        .sub-info {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 10px;
            display: flex;
            gap: 16px;
        }

            .sub-info span {
                display: flex;
                align-items: center;
                gap: 4px;
            }

        /* 页面内容区 */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 24px;
            padding-bottom: 90px;
        }
            /* 隐藏滚动条让界面更干净 */
            .content::-webkit-scrollbar {
                display: none;
            }

        .page {
            display: none;
            animation: fadeIn 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

            .page.active {
                display: block;
            }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 输入组件 */
        .input-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.02); /* 极微弱的阴影 */
        }

        .input-group {
            margin-bottom: 16px;
        }

            .input-group:last-child {
                margin-bottom: 0;
            }

        label {
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 8px;
            display: block;
            font-weight: 500;
        }

        input[type="number"], select {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-bottom: 1px solid var(--border-color);
            background: transparent;
            font-size: 20px;
            outline: none;
            color: var(--text-main);
            font-weight: 600;
            transition: border-color 0.3s;
        }

        select {
            font-size: 16px;
            appearance: none;
        }

            input[type="number"]:focus, select:focus {
                border-bottom: 2px solid var(--text-main);
            }

        /* 按钮设计：纯黑胶囊状 */
        button {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            margin-top: 10px;
            letter-spacing: 1px;
        }

            button:active {
                transform: scale(0.98);
                opacity: 0.8;
            }

        .btn-text {
            background: transparent;
            color: var(--text-sub);
            border: none;
            box-shadow: none;
        }

        /* 历史记录列表 */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            margin: 24px 0 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

            .history-list li {
                padding: 16px 0;
                border-bottom: 1px solid var(--border-color);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

        .li-left {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .li-category {
            font-size: 15px;
            color: var(--text-main);
            font-weight: 500;
        }

        .li-date {
            font-size: 12px;
            color: var(--text-sub);
        }

        .li-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .li-amount {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-main);
        }

        .delete-icon {
            background: none;
            border: none;
            color: #ccc;
            font-size: 14px;
            padding: 0;
            cursor: pointer;
            width: auto;
            margin: 0;
        }

            .delete-icon:hover {
                color: var(--danger-color);
            }

        /* 日历部分极简调整 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 16px;
        }

        .day-box {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-size: 14px;
            color: var(--text-sub);
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

            .day-box.current {
                background: var(--text-main);
                color: white;
                font-weight: 600;
            }

            .day-box.green {
                background: #EAF2EC;
                color: var(--success-color);
                font-weight: 600;
            }

            .day-box.red {
                background: #FCEAEA;
                color: var(--danger-color);
                font-weight: 600;
            }

        /* 底部导航栏：干净、通透 */
        .tab-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .tab-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #C0C0C0;
            font-size: 11px;
            cursor: pointer;
            transition: color 0.3s;
            font-weight: 500;
            gap: 4px;
        }

            .tab-item .icon {
                font-size: 20px;
            }

            .tab-item.active {
                color: var(--text-main);
            }

        /* 图表容器 */
        #pieChart, #lineChart {
            width: 100%;
            height: 240px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 10px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">

        <!-- 顶部余额信息 -->
        <div class="header">
            <div class="label">当前总资产</div>
            <div class="money-display" id="headerTotalMoney">¥0.00</div>
            <div class="sub-info">
                <span id="headerDaysLeft">距发钱 0 天</span>
                <span id="headerDailyQuota">明日预算 ¥0.00</span>
            </div>
        </div>

        <!-- 页面 1：记账 -->
        <div class="content page active" id="page-record">
            <div class="input-card">
                <div class="input-group">
                    <label>消费金额 (元)</label>
                    <input type="number" id="spendInput" placeholder="0.00">
                </div>
                <div class="input-group">
                    <label>消费分类</label>
                    <select id="categorySelect">
                        <option value="餐饮">餐饮</option>
                        <option value="交通">交通</option>
                        <option value="购物">购物</option>
                        <option value="娱乐">娱乐</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
            </div>
            <button onclick="calculate()">确认记账</button>

            <div class="section-title">最近记录</div>
            <ul class="history-list" id="recentHistoryList"></ul>
        </div>

        <!-- 页面 2：日历 -->
        <div class="content page" id="page-calendar">
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="section-title" style="margin-top:0;">本月概览</div>
                <button class="btn-text" onclick="nextDay()" style="width: auto; padding: 0; font-size: 12px;">下一日测试 ></button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>

            <div class="section-title" id="calendarDetailTitle" style="margin-top: 30px;">明细</div>
            <ul class="history-list" id="calendarDetailList">
                <li style="justify-content:center; color:var(--text-sub); border:none;">点击上方日期查看</li>
            </ul>
        </div>

        <!-- 页面 3：统计 -->
        <div class="content page" id="page-stats">
            <div class="section-title" style="margin-top:0;">分类占比</div>
            <div class="chart-card"><div id="pieChart"></div></div>

            <div class="section-title">支出趋势</div>
            <div class="chart-card"><div id="lineChart"></div></div>
        </div>

        <!-- 页面 4：设置 -->
        <div class="content page" id="page-settings">
            <div class="input-card">
                <div class="input-group">
                    <label>本周期初始总额 (元)</label>
                    <input type="number" id="totalMoneyInput" onchange="updateTotalMoney()">
                </div>
                <div class="input-group">
                    <label>目标存款 (元)</label>
                    <input type="number" id="targetSave" onchange="updateTargetSave()">
                </div>
                <div class="input-group">
                    <label>发生活费日 (号)</label>
                    <input type="number" id="payDayInput" min="1" max="28" onchange="updatePayDay()">
                </div>
            </div>

            <button class="btn-outline" onclick="settlePeriod()" style="background: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);">结束本周期并结算</button>
            <button class="btn-text" onclick="resetData()" style="margin-top: 16px; color: var(--danger-color);">清空所有数据</button>
        </div>

        <!-- 底部导航栏 -->
        <div class="tab-bar">
            <div class="tab-item active" onclick="switchTab('record', this)">
                <span class="icon">✏️</span><span>记账</span>
            </div>
            <div class="tab-item" onclick="switchTab('calendar', this)">
                <span class="icon">📅</span><span>日历</span>
            </div>
            <div class="tab-item" onclick="switchTab('stats', this)">
                <span class="icon">📊</span><span>统计</span>
            </div>
            <div class="tab-item" onclick="switchTab('settings', this)">
                <span class="icon">⚙️</span><span>设置</span>
            </div>
        </div>
    </div>

    <script>
            // --- 核心数据 ---
            let state = JSON.parse(localStorage.getItem("ledgerStateMinimal")) || {
                initialMoney: 3000,
                totalMoney: 3000,
                targetSave: 1000,
                payDay: 15,
                currentDate: getTodayString(),
                records: [],
                historyPeriods: []
            };

            let viewingDate = null;
            let pieChartInstance, lineChartInstance;

            function init() {
                document.getElementById("totalMoneyInput").value = state.initialMoney;
                document.getElementById("targetSave").value = state.targetSave;
                document.getElementById("payDayInput").value = state.payDay;

                pieChartInstance = echarts.init(document.getElementById('pieChart'));
                lineChartInstance = echarts.init(document.getElementById('lineChart'));

                renderAll();
            }

            function getTodayString() {
                let d = new Date();
                return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
            }

            function switchTab(pageId, element) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));

                document.getElementById('page-' + pageId).classList.add('active');
                element.classList.add('active');

                if(pageId === 'stats') {
                    setTimeout(() => {
                        pieChartInstance.resize();
                        lineChartInstance.resize();
                        renderCharts();
                    }, 50);
                }
            }

            function getDaysLeft() {
                let today = new Date(state.currentDate);
                let currentDay = today.getDate();
                let daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
                if (currentDay <= state.payDay) return state.payDay - currentDay + 1;
                return (daysInMonth - currentDay) + state.payDay + 1;
            }

            function getDailyQuota() {
                let daysLeft = getDaysLeft();
                return (state.totalMoney - state.targetSave) / daysLeft;
            }

            function calculate() {
                let spend = Number(document.getElementById("spendInput").value);
                let category = document.getElementById("categorySelect").value;

                if (!spend || spend <= 0) { alert("请输入金额"); return; }

                state.totalMoney -= spend;
                state.records.unshift({
                    id: Date.now(),
                    date: state.currentDate,
                    amount: spend,
                    category: category
                });

                saveData();
                renderAll();
                document.getElementById("spendInput").value = "";
            }

            function deleteRecord(id) {
                if(!confirm("删除此记录？金额将退回。")) return;
                let record = state.records.find(r => r.id === id);
                if(record) {
                    state.totalMoney += record.amount;
                    state.records = state.records.filter(r => r.id !== id);
                    saveData(); renderAll();
                }
            }

            function updateTotalMoney() {
                let val = Number(document.getElementById("totalMoneyInput").value);
                if(val > 0) {
                    let spent = state.records.reduce((sum, r) => sum + r.amount, 0);
                    state.initialMoney = val;
                    state.totalMoney = val - spent;
                    saveData(); renderAll();
                }
            }

            function updateTargetSave() {
                state.targetSave = Number(document.getElementById("targetSave").value);
                saveData(); renderAll();
            }

            function updatePayDay() {
                state.payDay = Number(document.getElementById("payDayInput").value);
                saveData(); renderAll();
            }

            function settlePeriod() {
                if(!confirm(`结束本周期？剩余 ¥${state.totalMoney.toFixed(2)} 将存入历史。`)) return;
                let totalSpent = state.records.reduce((sum, r) => sum + r.amount, 0);
                state.historyPeriods.push({ startDate: state.currentDate, initialMoney: state.initialMoney, totalSpent: totalSpent, savedMoney: state.totalMoney });
                state.records = [];
                state.totalMoney = state.initialMoney;
                state.currentDate = getTodayString();
                saveData(); renderAll();
                alert("结算成功，已开启新周期。");
            }

            function renderAll() {
                renderHeader();
                renderRecentHistory();
                renderCalendar();
                renderCharts();
            }

            function renderHeader() {
                let quota = getDailyQuota();
                let daysLeft = getDaysLeft();
                document.getElementById("headerTotalMoney").innerText = `¥${state.totalMoney.toFixed(2)}`;
                document.getElementById("headerDaysLeft").innerText = `距发钱 ${daysLeft} 天`;

                let quotaEl = document.getElementById("headerDailyQuota");
                quotaEl.innerText = `明日预算 ¥${quota > 0 ? quota.toFixed(2) : '0.00'}`;
                quotaEl.style.color = quota > 0 ? 'var(--success-color)' : 'var(--danger-color)';
            }

            function renderRecentHistory() {
                let ul = document.getElementById("recentHistoryList");
                ul.innerHTML = state.records.length === 0 ? "<li style='justify-content:center; color:var(--text-sub); border:none;'>暂无记录</li>" : "";

                for (let i = 0; i < Math.min(state.records.length, 5); i++) {
                    let r = state.records[i];
                    ul.innerHTML += `
                        <li>
                            <div class="li-left">
                                <span class="li-category">${r.category}</span>
                                <span class="li-date">${r.date}</span>
                            </div>
                            <div class="li-right">
                                <span class="li-amount">-¥${r.amount.toFixed(2)}</span>
                                <button class="delete-icon" onclick="deleteRecord(${r.id})">×</button>
                            </div>
                        </li>`;
                }
            }

            function renderCalendar() {
                let grid = document.getElementById("calendarGrid");
                grid.innerHTML = "";
                let d = new Date(state.currentDate);
                let year = d.getFullYear(); let month = d.getMonth();
                let daysInMonth = new Date(year, month + 1, 0).getDate();
                let quota = getDailyQuota();

                for (let i = 1; i <= daysInMonth; i++) {
                    let dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(i).padStart(2, '0')}`;
                    let daySpent = state.records.filter(r => r.date === dateStr).reduce((sum, r) => sum + r.amount, 0);

                    let box = document.createElement("div");
                    box.className = "day-box";
                    box.innerText = i;
                    box.onclick = () => viewCalendarDay(dateStr);

                    if (dateStr === state.currentDate) box.classList.add("current");
                    else if (daySpent > 0) {
                        if (daySpent > quota) box.classList.add("red");
                        else box.classList.add("green");
                    }
                    grid.appendChild(box);
                }
            }

            function viewCalendarDay(dateStr) {
                viewingDate = dateStr;
                document.getElementById("calendarDetailTitle").innerText = `${dateStr} 明细`;
                let list = document.getElementById("calendarDetailList");
                let dayRecords = state.records.filter(r => r.date === dateStr);

                list.innerHTML = dayRecords.length === 0 ? "<li style='justify-content:center; color:var(--text-sub); border:none;'>没有消费记录</li>" : "";
                dayRecords.forEach(r => {
                    list.innerHTML += `
                        <li>
                            <div class="li-left">
                                <span class="li-category">${r.category}</span>
                            </div>
                            <div class="li-right">
                                <span class="li-amount">-¥${r.amount.toFixed(2)}</span>
                                <button class="delete-icon" onclick="deleteRecord(${r.id})">×</button>
                            </div>
                        </li>`;
                });
            }

            function renderCharts() {
                if(!pieChartInstance || !lineChartInstance) return;

                // 极简高级配色：单色系
                let primaryColor = '#111111';
                let gradientColor = ['#333333', '#555555', '#777777', '#999999', '#BBBBBB'];

                // 1. 环形图
                let categoryData = {};
                state.records.forEach(r => {
                    categoryData[r.category] = (categoryData[r.category] || 0) + r.amount;
                });
                let pieData = Object.keys(categoryData).map(key => ({ name: key, value: categoryData[key] }));
                if(pieData.length === 0) pieData = [{name: '暂无消费', value: 1}];

                pieChartInstance.setOption({
                    tooltip: { trigger: 'item', backgroundColor: '#111', textStyle: { color: '#fff' } },
                    color: gradientColor,
                    series: [{
                        type: 'pie', radius: ['50%', '75%'],
                        avoidLabelOverlap: false,
                        itemStyle: { borderRadius: 6, borderColor: '#fff', borderWidth: 2 },
                        label: { show: false },
                        emphasis: { label: { show: true, fontSize: 14, fontWeight: 'bold', color: '#111' } },
                        data: pieData
                    }]
                });

                // 2. 折线图
                let dailyData = {};
                state.records.forEach(r => {
                    dailyData[r.date] = (dailyData[r.date] || 0) + r.amount;
                });
                let dates = Object.keys(dailyData).sort();
                let values = dates.map(d => dailyData[d]);
                let quota = getDailyQuota();

                lineChartInstance.setOption({
                    tooltip: { trigger: 'axis', backgroundColor: '#111', textStyle: { color: '#fff' } },
                    grid: { top: 20, bottom: 20, left: 10, right: 10 },
                    xAxis: {
                        type: 'category', data: dates.map(d => d.slice(8)), // 只显示日
                        axisLine: { lineStyle: { color: '#eee' } },
                        axisTick: { show: false },
                        axisLabel: { color: '#888', fontSize: 11 }
                    },
                    yAxis: {
                        type: 'value', splitLine: { lineStyle: { type: 'dashed', color: '#f0f0f0' } },
                        axisLabel: { color: '#888', fontSize: 11 }
                    },
                    series: [{
                        name: '每日支出',
                        type: 'line',
                        smooth: true,
                        data: values,
                        itemStyle: { color: primaryColor },
                        lineStyle: { width: 2 },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(17,17,17,0.1)' },
                                { offset: 1, color: 'rgba(17,17,17,0)' }
                            ])
                        },
                        markLine: {
                            data: [{ yAxis: quota }],
                            lineStyle: { color: '#E55353', type: 'dashed', width: 1.5 },
                            label: { show: false }
                        }
                    }]
                });
            }

            function nextDay() {
                let d = new Date(state.currentDate);
                d.setDate(d.getDate() + 1);
                state.currentDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
                saveData(); renderAll();
            }

            function saveData() { localStorage.setItem("ledgerStateMinimal", JSON.stringify(state)); }
            function resetData() {
                if (confirm("确定要彻底清空所有数据吗？")) { localStorage.clear(); location.reload(); }
            }

            init();
    </script>
</body>
</html>
